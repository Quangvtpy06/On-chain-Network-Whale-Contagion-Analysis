# T18 Train/Test Split — Proposed Configuration
# Generated by T18 look-ahead audit (T18_Leakage_Audit)
# [DEFAULT — not yet confirmed with team; proposed by T18 based on 80/20 rule]

protocol_id: t18_train_test_split_v1

# Data coverage from t14_features_daily.parquet
data_start: "2025-01-01"
data_end: "2026-10-17"
total_rows: 655

# Proposed split (80% train / 20% test by chronological order)
# Rationale: time-series data must be split chronologically, not randomly.
# 80/20 gives ~131 test days (~4.3 months), sufficient for event study OOS check.
split_method: chronological_80_20

cutoff_date: "2026-06-08" # last day of training set (inclusive)
train_start: "2025-01-01"
train_end: "2026-06-08" # inclusive; n_train = 524
test_start: "2026-06-09"
test_end: "2026-10-17" # inclusive; n_test  = 131

n_train: 524
n_test: 131

# Applies to:
scope:
  - T15_Volatility_Regression.py # model selection and hyperparameters on train only
  - T16_Event_Study.py # event thresholds computed on train window only

# Rules
rules:
  - "Model selection (controls, horizons) must be decided on train set only."
  - "HAC maxlags formula uses n_train, not n_total, when running OOS evaluation."
  - "T16 rolling thresholds (rolling-90d) naturally use only past data — no change needed."
  - "Test set must not be inspected to tune any parameter before final OOS evaluation."
  - "whale_inflow test set has only 1 event — OOS result for this type is not interpretable."

